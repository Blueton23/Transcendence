# POUR LA PROD
# "./srcs/backend:/app" est a retirer pour la prod
# "port 8080:80" de nginx a changer pour la prod en "443:443"

services:
  db:
    image: postgres:17-alpine
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./srcs/backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file:
      - ./.env
    volumes:
      - ./srcs/backend:/app
      - static_data:/app/staticfiles
      - media_data:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./srcs/frontend
    volumes:
      - ./srcs/frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    build: ./srcs/nginx
    ports:
      - "8080:80"
    volumes:
      - static_data:/static:ro
      - media_data:/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
  static_data:
  media_data: