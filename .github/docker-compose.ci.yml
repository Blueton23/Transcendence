# CI-only overrides: reuse Docker layers between runs via the GitHub Actions cache
services:
  backend:
    build:
      cache_from: [type=gha,scope=backend]
      cache_to: [type=gha,scope=backend,mode=max]
  frontend:
    build:
      cache_from: [type=gha,scope=frontend]
      cache_to: [type=gha,scope=frontend,mode=max]
  nginx:
    build:
      cache_from: [type=gha,scope=nginx]
      cache_to: [type=gha,scope=nginx,mode=max]
