name: Smoke Test

# Builds and starts the whole stack, then checks it works end to end through nginx
on:
  push:
    branches: [main]
    paths:
      - "srcs/**"
      - "docker-compose.yml"
      - "Makefile"
      - "scripts/smoke.sh"
      - ".github/docker-compose.ci.yml"
      - ".github/workflows/smoke.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "srcs/**"
      - "docker-compose.yml"
      - "Makefile"
      - "scripts/smoke.sh"
      - ".github/docker-compose.ci.yml"
      - ".github/workflows/smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_FILE: docker-compose.yml:.github/docker-compose.ci.yml

jobs:
  smoke:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Prepare env file
        run: |
          cp .env.example .env
          sed -i "s/^UID=.*/UID=$(id -u)/; s/^GID=.*/GID=$(id -g)/" .env

      - uses: docker/setup-buildx-action@v3

      # Exposes the cache credentials that the gha cache backend needs
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Apply migrations
        run: make migrate

      - name: Smoke test
        run: make smoke

      - name: Dump logs
        if: failure()
        run: docker compose logs --no-color
