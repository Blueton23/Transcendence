name: Smoke Test

# Builds and starts the whole stack, then checks it works end to end through nginx
on:
  push:
    branches: [main]
    paths:
      - "srcs/**"
      - "docker-compose.yml"
      - "Makefile"
      - "scripts/smoke.sh"
      - ".github/docker-compose.ci.yml"
      - ".github/workflows/smoke.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "srcs/**"
      - "docker-compose.yml"
      - "Makefile"
      - "scripts/smoke.sh"
      - ".github/docker-compose.ci.yml"
      - ".github/workflows/smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_FILE: docker-compose.yml:.github/docker-compose.ci.yml

jobs:
  smoke:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Prepare env file and test certificate
        run: |
          cp .env.example .env
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          mkdir -p certs/live/peripl.app
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout certs/live/peripl.app/privkey.pem \
            -out certs/live/peripl.app/fullchain.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - uses: docker/setup-buildx-action@v3

      # Exposes the cache credentials that the gha cache backend needs
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Apply migrations
        run: make migrate

      - name: Smoke test
        run: make smoke

      - name: Dump logs
        if: failure()
        run: docker compose logs --no-color
