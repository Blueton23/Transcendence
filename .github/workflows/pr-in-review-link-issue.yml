name: PR review demandée → In Review (carte de l'issue liée)

# Prérequis :
# - la description de la PR doit contenir "Closes #12" (avec le vrai numéro d'issue)

on:
  pull_request:
    types: [review_requested, ready_for_review]

jobs:
  move-linked-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }}
      PR_NODE_ID: ${{ github.event.pull_request.node_id }}
      PROJECT_OWNER: "Blueton23"
      PROJECT_NUMBER: "1"
      STATUS_FIELD_NAME: "Status"
      TARGET_OPTION_NAME: "In Review"

    steps:
      - name: Récupérer les infos du Project (id, champ Status, option "In Review")
        id: project-info
        run: |
          RESULT=$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) {
                  id
                  field(name: "'"$STATUS_FIELD_NAME"'") {
                    ... on ProjectV2SingleSelectField {
                      id
                      options { id name }
                    }
                  }
                }
              }
            }' -f owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")

          PROJECT_ID=$(echo "$RESULT" | jq -r '.data.user.projectV2.id')
          FIELD_ID=$(echo "$RESULT" | jq -r '.data.user.projectV2.field.id')
          OPTION_ID=$(echo "$RESULT" | jq -r --arg name "$TARGET_OPTION_NAME" '.data.user.projectV2.field.options[] | select(.name == $name) | .id')

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "field_id=$FIELD_ID" >> "$GITHUB_OUTPUT"
          echo "option_id=$OPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Trouver la carte de l'issue liée à cette PR
        id: linked-issue
        run: |
          RESULT=$(gh api graphql -f query='
            query($pr: ID!) {
              node(id: $pr) {
                ... on PullRequest {
                  closingIssuesReferences(first: 1) {
                    nodes {
                      projectItems(first: 10) {
                        nodes { id project { number } }
                      }
                    }
                  }
                }
              }
            }' -f pr="$PR_NODE_ID")

          ITEM_ID=$(echo "$RESULT" | jq -r --arg num "$PROJECT_NUMBER" \
            '.data.node.closingIssuesReferences.nodes[0].projectItems.nodes[] | select(.project.number == ($num|tonumber)) | .id')

          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" == "null" ]; then
            echo "Aucune issue liée trouvée sur ce Project. As-tu bien écrit 'Closes #12' dans la description de la PR, et l'issue #12 est-elle déjà sur le board ?"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "item_id=$ITEM_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Passer la carte en "In Review"
        if: steps.linked-issue.outputs.skip != 'true'
        run: |
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' \
            -f project="${{ steps.project-info.outputs.project_id }}" \
            -f item="${{ steps.linked-issue.outputs.item_id }}" \
            -f field="${{ steps.project-info.outputs.field_id }}" \
            -f option="${{ steps.project-info.outputs.option_id }}"