# One grouped PR per ecosystem per week, to keep the noise down
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /srcs/backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /srcs/frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/srcs/backend, /srcs/frontend, /srcs/nginx]
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
